    <style>
      :root {
        --ink: #13243a;
        --ink-2: #23364f;
        --muted: #617187;
        --line: #dce3ea;
        --paper: #fbfaf6;
        --paper-2: #f2f6f3;
        --card: #ffffff;
        --sage: #2f8f6b;
        --sage-dark: #1f6e53;
        --sage-soft: #e4f3ec;
        --blue: #3767d6;
        --blue-soft: #eaf0ff;
        --amber: #f2b84b;
        --red: #df5f56;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, #224b3a, var(--sage));
        color: white;
        display: grid;
        place-items: center;
        font-weight: 1000;
        box-shadow: inset 0 -4px rgba(0, 0, 0, 0.18);
      }
      .brand-mark::before {
        content: "∑";
        font-size: 24px;
        transform: translateY(-1px);
      }
      .brand-word {
        font-weight: 1000;
        letter-spacing: -0.05em;
        color: var(--ink);
        font-size: 28px;
      }
      .btn-rise {
        border: 0;
        border-radius: 14px;
        font-weight: 900;
        letter-spacing: 0.02em;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          background 0.15s ease;
      }
      .btn-rise:active {
        transform: translateY(3px);
        box-shadow: none !important;
      }
      .btn-primary {
        background: var(--sage);
        color: white;
        box-shadow: 0 4px 0 var(--sage-dark);
      }
      .btn-primary:hover {
        background: #36a177;
      }
      .btn-secondary {
        background: white;
        color: var(--blue);
        border: 2px solid var(--line);
        box-shadow: 0 3px 0 #cfd7e0;
      }
      .btn-secondary:hover {
        background: #f7f9ff;
      }
      .btn-ink {
        background: var(--ink);
        color: white;
        box-shadow: 0 4px 0 #0b1624;
      }

      .aqyl-pill-btn {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        height: 50px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        padding: 0 48px 0 24px;
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition:
          padding 0.5s cubic-bezier(0.65, 0, 0.35, 1),
          background 0.25s ease,
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .aqyl-pill-btn:hover {
        padding: 0 24px 0 48px;
      }
      .aqyl-pill-btn:active {
        transform: translateY(3px);
        box-shadow: none !important;
      }
      .aqyl-pill-btn-primary {
        background: var(--sage);
        color: white;
        box-shadow: 0 4px 0 var(--sage-dark);
      }
      .aqyl-pill-btn-primary:hover {
        background: #36a177;
      }
      .aqyl-pill-btn-secondary {
        background: white;
        color: var(--blue);
        border: 2px solid var(--line);
        box-shadow: 0 3px 0 #cfd7e0;
      }
      .aqyl-pill-btn-secondary:hover {
        background: #f7f9ff;
      }
      .aqyl-pill-btn-label {
        position: relative;
        z-index: 1;
        white-space: nowrap;
      }
      .aqyl-pill-btn-icon {
        position: absolute;
        top: 50%;
        right: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        transform: translateY(-50%);
        transition:
          right 0.5s cubic-bezier(0.65, 0, 0.35, 1),
          transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .aqyl-pill-btn:hover .aqyl-pill-btn-icon {
        right: calc(100% - 42px);
        transform: translateY(-50%) rotate(45deg);
      }
      .aqyl-pill-btn-icon-primary {
        background: white;
        color: var(--sage);
      }
      .aqyl-pill-btn-icon-secondary {
        background: var(--blue);
        color: white;
      }
      @media (max-width: 480px) {
        .aqyl-pill-btn {
          height: 46px;
          font-size: 14px;
          padding: 0 44px 0 20px;
        }
        .aqyl-pill-btn:hover {
          padding: 0 20px 0 44px;
        }
        .aqyl-pill-btn-icon {
          width: 32px;
          height: 32px;
        }
        .aqyl-pill-btn:hover .aqyl-pill-btn-icon {
          right: calc(100% - 38px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .aqyl-pill-btn,
        .aqyl-pill-btn-icon {
          transition: background 0.25s ease;
        }
        .aqyl-pill-btn:hover {
          padding: 0 48px 0 24px;
        }
        .aqyl-pill-btn:hover .aqyl-pill-btn-icon {
          right: 6px;
          transform: translateY(-50%);
        }
      }

      .hero-illustration {
        position: relative;
        width: min(520px, 100%);
        height: 430px;
        margin: auto;
      }
      .hero-tablet {
        position: absolute;
        left: 96px;
        top: 118px;
        width: 330px;
        height: 220px;
        border-radius: 30px;
        background: white;
        border: 8px solid var(--ink);
        box-shadow:
          0 24px 0 #e7ecf0,
          0 32px 50px rgba(19, 36, 58, 0.16);
        transform: rotate(-5deg);
      }
      .hero-tablet::before,
      .hero-tablet::after {
        content: "";
        position: absolute;
        left: 38px;
        height: 15px;
        border-radius: 999px;
      }
      .hero-tablet::before {
        top: 45px;
        width: 195px;
        background: #dfe8f0;
      }
      .hero-tablet::after {
        top: 84px;
        width: 125px;
        background: var(--sage);
      }
      .math-chip {
        position: absolute;
        display: grid;
        place-items: center;
        color: white;
        font-weight: 1000;
        border-radius: 24px;
        box-shadow:
          inset 0 -7px rgba(0, 0, 0, 0.14),
          0 14px 28px rgba(19, 36, 58, 0.12);
        animation: chipFloat 6s ease-in-out infinite;
      }
      .math-chip:nth-child(odd) {
        animation-delay: -1.4s;
      }
      .math-chip:nth-child(even) {
        animation-delay: -3s;
      }
      @keyframes chipFloat {
        0%,
        100% {
          transform: translateY(0) rotate(var(--r));
        }
        50% {
          transform: translateY(-14px) rotate(calc(var(--r) + 4deg));
        }
      }

      .aqylai-filmstrip-intro {
        background: var(--paper);
        padding: 88px 24px 56px;
        text-align: center;
      }
      .aqylai-filmstrip-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--sage-soft);
        color: var(--sage-dark);
        font-weight: 900;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .aqylai-filmstrip-heading {
        max-width: 780px;
        margin: 22px auto 0;
        font-size: clamp(28px, 4vw, 50px);
        line-height: 1.12;
        font-weight: 1000;
        letter-spacing: -0.03em;
        color: var(--ink);
      }
      .aqylai-filmstrip-section {
        position: relative;
        background: #0d1420;
      }
      .aqylai-filmstrip-pin {
        height: 100vh;
        overflow: hidden;
        position: relative;
      }
      .aqylai-filmstrip-scrub {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 34px 6vw 0;
      }
      .aqylai-filmstrip-scrub-num {
        font-weight: 1000;
        font-size: 13px;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.45);
        transition: color 0.3s ease;
      }
      .aqylai-filmstrip-scrub-num.is-active {
        color: #fff;
      }
      .aqylai-filmstrip-scrub-track {
        flex: 1;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.16);
        position: relative;
        overflow: hidden;
      }
      .aqylai-filmstrip-scrub-fill {
        position: absolute;
        inset: 0;
        background: #fff;
        transform: scaleX(0);
        transform-origin: left;
      }
      .aqylai-filmstrip-track {
        display: flex;
        height: 100%;
        will-change: transform;
      }
      .aqylai-filmstrip-panel {
        width: 100vw;
        height: 100%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8vw;
      }
      .aqylai-filmstrip-panel-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4vw;
        align-items: center;
        max-width: 1180px;
        width: 100%;
      }
      .aqylai-filmstrip-panel-eyebrow {
        font-weight: 1000;
        font-size: 13px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.62;
        margin-bottom: 14px;
      }
      .aqylai-filmstrip-panel h3 {
        font-size: clamp(24px, 2.9vw, 42px);
        line-height: 1.15;
        font-weight: 1000;
        letter-spacing: -0.03em;
        margin: 0 0 16px 0;
      }
      .aqylai-filmstrip-panel p {
        font-size: clamp(15px, 1.15vw, 18px);
        line-height: 1.65;
        font-weight: 600;
        opacity: 0.86;
        margin: 0;
        max-width: 42ch;
      }
      .aqylai-filmstrip-visual {
        justify-self: end;
      }

      /* panel 1 — course path card */
      .aqylai-path-card {
        width: 100%;
        max-width: 360px;
        padding: 26px 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(6px);
      }
      .aqylai-path-tag {
        font-weight: 900;
        font-size: 12px;
        letter-spacing: 0.06em;
        opacity: 0.65;
        margin-bottom: 20px;
      }
      .aqylai-path-step {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }
      .aqylai-path-stem {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 14px;
        flex-shrink: 0;
      }
      .aqylai-path-node {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        flex-shrink: 0;
      }
      .aqylai-path-node.is-done {
        background: rgba(255, 255, 255, 0.55);
      }
      .aqylai-path-node.is-active {
        background: #fff;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25);
      }
      .aqylai-path-line {
        width: 1px;
        flex: 1;
        min-height: 26px;
        background: rgba(255, 255, 255, 0.22);
      }
      .aqylai-path-label {
        font-weight: 900;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.55;
      }
      .aqylai-path-label.is-active {
        opacity: 0.95;
      }
      .aqylai-path-title {
        font-size: 15px;
        font-weight: 800;
        margin-top: 2px;
      }
      .aqylai-path-footer {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        font-size: 13px;
        opacity: 0.78;
      }
      .aqylai-path-footer-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        flex-shrink: 0;
      }

      /* panel 2 — chat mockup */
      .aqylai-chat {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 340px;
      }
      .aqylai-bubble-q {
        align-self: flex-end;
        padding: 14px 18px;
        border-radius: 18px 18px 4px 18px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.45;
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .aqylai-ai-row {
        align-self: flex-start;
        display: flex;
        align-items: flex-end;
        gap: 9px;
      }
      .aqylai-ai-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-weight: 1000;
        font-size: 11px;
        background: #fff;
        color: #13243a;
      }
      .aqylai-bubble-a {
        padding: 14px 18px;
        border-radius: 18px 18px 18px 4px;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.45;
        background: #fff;
        color: #13243a;
      }

      /* panel 3 — flip cards */
      .aqylai-cards {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        max-width: 360px;
      }
      .aqylai-flip-card {
        width: 104px;
        height: 130px;
        border-radius: 18px;
        background: rgba(19, 36, 58, 0.06);
        border: 1px solid rgba(19, 36, 58, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-weight: 800;
        font-size: 12px;
      }
      .aqylai-flip-card .sym {
        font-size: 22px;
        font-weight: 1000;
      }

      /* panel 4 — progress ring */
      .aqylai-ring-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .aqylai-ring {
        position: relative;
        width: 210px;
        height: 210px;
      }
      .aqylai-ring-pct {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-weight: 1000;
        font-size: 32px;
      }
      .aqylai-skill-bars {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 210px;
      }
      .aqylai-skill-bar {
        height: 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.16);
        position: relative;
        overflow: hidden;
      }
      .aqylai-skill-bar span {
        position: absolute;
        inset: 0;
        border-radius: 4px;
        background: #fff;
      }

      @media (max-width: 820px) {
        .aqylai-filmstrip-panel-inner {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .aqylai-filmstrip-visual {
          justify-self: center;
          margin-top: 22px;
        }
        .aqylai-filmstrip-panel p {
          margin-inline: auto;
        }
        .aqylai-path-card,
        .aqylai-chat,
        .aqylai-cards {
          margin-inline: auto;
        }
        .aqylai-filmstrip-scrub {
          padding: 20px 6vw 0;
        }
      }

      .app-topbar {
        height: 68px;
        background: #18314d;
        color: white;
        border-bottom: 1px solid #0f2237;
      }
      .workspace-strip {
        min-height: 58px;
        background: white;
        border-bottom: 1px solid var(--line);
      }
      .app-shell {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: calc(100vh - 126px);
      }
      .left-nav {
        border-right: 1px solid var(--line);
        background: #f8faf8;
        overflow-y: auto;
        max-height: calc(100vh - 126px);
      }
      .main-workspace {
        background: white;
        overflow-y: auto;
        max-height: calc(100vh - 126px);
        min-width: 0;
      }
      .right-insights {
        display: none;
      }
      .course-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 1px 0 #e9edf2;
      }
      .topic-row {
        border: 1px solid transparent;
        border-radius: 14px;
      }
      .topic-row:hover {
        background: #edf6f1;
      }
      .topic-row.active {
        background: var(--sage-soft);
        border-color: #b9ddcc;
      }
      .type-icon {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: white;
        font-weight: 900;
        color: var(--ink);
      }
      .type-icon.video {
        color: var(--blue);
      }
      .type-icon.practice {
        color: var(--sage);
      }
      .type-icon.test {
        color: #a76c00;
      }
      .skill-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 1px 0 #e9edf2;
      }
      .insight-card {
        background: linear-gradient(180deg, #ffffff, #fbfcfb);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(19, 36, 58, 0.06);
      }
      .soft-callout {
        border-radius: 24px;
        border: 1px solid #cfe8dc;
        background: linear-gradient(135deg, #f0fbf5, #ffffff);
      }
      .focus-ring:focus {
        outline: none;
        border-color: var(--sage);
        box-shadow: 0 0 0 4px rgba(47, 143, 107, 0.12);
      }
      .pill {
        border-radius: 999px;
        border: 1px solid var(--line);
        background: white;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 800;
        color: var(--muted);
      }
      .progress-track {
        height: 10px;
        background: #e4e9ef;
        border-radius: 99px;
        overflow: hidden;
      }

      /* Expression states are independent of the form layout. Privacy has priority. */

      @keyframes onboardBlink {
        0%,
        94%,
        98%,

      .onboard-react-characters[data-mood="idle"]

      /* Registration floating labels — no external animation runtime. */
      .onboard-shell .animated-field {

        position: absolute;
        left: 0;
        top: 34px;
        right: 48px;

        font-size: 17px;
        font-weight: 500;
        color: #728077;
        cursor: text;
        pointer-events: auto;
      }
      .onboard-shell .animated-label-readable {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .onboard-shell .animated-label-letters > span {
        display: inline-block;

      .onboard-shell .animated-input-area[data-raised="true"] .animated-label,
      .onboard-shell .animated-input:focus ~ .animated-label,
      .onboard-shell .animated-input:not(:placeholder-shown) ~ .animated-label {
        top: 2px;
        font-size: 13px;

        color: #17533e;

      @keyframes aqylLabelLift {
        0% {
          transform: translateY(7px);

        65% {
          transform: translateY(-2px);

        100% {
          transform: translateY(0);

        from {
          opacity: 1;

        to {
          opacity: 1;

        animation: aqylAutofill 0.01s;

        top: 2px;
        font-size: 13px;
        font-weight: 600;
      }
      .onboard-shell .animated-input:-webkit-autofill ~ .animated-label {
        top: 2px;

      .course-overview .co-next > p:not(.co-eyebrow) {
        margin-top: 12px;
        max-width: 62ch;
        color: #536d5c;
        font-size: 16px;
      }
      .course-overview button {
        font:
          600 15px/1.4 "Manrope",
          "Noto Sans",
          sans-serif;
        min-height: 46px;
        min-width: 44px;
        border-radius: 12px;
        padding: 12px 18px;
        cursor: pointer;
        transition:
          background-color 0.18s,
          border-color 0.18s,
          color 0.18s;
      }
      .course-overview button:focus-visible {
        outline: 3px solid #258564;
        outline-offset: 4px;
      }
      .course-overview .co-primary {
        margin-top: 24px;
        background: #185743;
        color: white;
        border: 1px solid #185743;
      }
      .course-overview .co-primary:hover {
        background: #236e54;
        border-color: #236e54;
      }
      .course-overview .co-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 28px;
        margin: 22px 0 36px;
        padding: 0 4px;
      }
      .course-overview .co-metrics > div {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 13px;
        color: #6b7b70;
      }
      .course-overview .co-metrics svg {
        color: #4e7860;
        flex-shrink: 0;
      }
      .course-overview .co-metrics dd {
        font-size: 16px;
        font-weight: 600;
        color: #294b38;
      }
      .course-overview .co-list-heading {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px 20px;
        margin-bottom: 18px;
      }
      .course-overview .co-list-heading h2 {
        font-size: 22px;
        font-weight: 600;
      }
      .course-overview .co-list-heading p {
        font-size: 14px;
        color: #697a6d;
        overflow-wrap: anywhere;
      }
      .course-overview .co-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .course-overview .co-topic {
        min-width: 0;
        background: #fff;
        border: 1px solid #dfe7e1;
        border-radius: 20px;
        padding: 22px;
        display: flex;
        flex-direction: column;
      }
      .course-overview .co-unit {
        font-size: 12px;
        font-weight: 500;
        color: #708173;
        margin-bottom: 10px;
      }
      .course-overview .co-topic h3 {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .course-overview .co-description {
        font-size: 14px;
        color: #6b7b70;
        margin-top: 10px;
        line-height: 1.65;
      }
      .course-overview .co-topic-footer {
        margin-top: auto;
        padding-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .course-overview .co-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: #708074;
      }
      .course-overview .co-status-active {
        color: #816016;
      }
      .course-overview .co-status-done {
        color: #1b7350;
      }
      .course-overview .co-action {
        border: 1px solid #d5e2d8;
        background: white;
        color: #185743;
      }
      .course-overview .co-action:hover {
        background: #edf5ef;
        border-color: #aacbb7;
      }
      .course-overview .co-empty {
        padding: 24px;
        border: 1px solid #dfe7e1;
        border-radius: 18px;
        background: white;
        color: #68796d;
      }
      @media (min-width: 1440px) {
        .course-overview .co-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 1100px) and (min-width: 821px) {
        .course-overview {
          padding: 28px 24px;
        }
        .course-overview .co-grid {
          gap: 16px;
        }
        .course-overview .co-topic {
          padding: 20px;
        }
      }
      @media (max-width: 600px) {
        .course-overview {
          padding: 24px 16px 32px;
        }
        .course-overview .co-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 16px;
        }
        .course-overview .co-next {
          padding: 24px;
          margin-top: 22px;
        }
        .course-overview .co-metrics {
          display: grid;
          gap: 10px;
          margin-bottom: 28px;
        }
        .course-overview .co-metrics dd {
          margin-left: auto;
        }
        .course-overview .co-primary {
          width: 100%;
        }
        .course-overview .co-topic h3 {
          font-size: 19px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .course-overview * {
          animation: none !important;
          transition: none !important;
        }
      }

      .aqyl-poster-menu-layer .aqyl-fullmenu-overlay {
        z-index: 1000;
      }
      /* AqylAI poster: isolated from registration and the learning cabinet. */
      .aqyl-poster {
        --poster-diameter: 640px;
        --poster-circle-top: 245px;
        background: #17533e;
      }
      .aqyl-poster [data-portal-pin] {
        background: #f4f0e5;
        min-height: 0;
        height: var(--portal-height);
        overflow: clip;
      }
      .aqyl-poster[data-motion="on"] [data-portal-pin] {
        top: var(--poster-sticky-top, 0px);
      }
      .aqyl-poster[data-motion="on"] [data-portal-content] {
        margin-top: calc(
          var(--poster-overflow) + var(--portal-travel) - var(--portal-height)
        );
      }
      .aqyl-poster [data-portal-content] {
        min-height: 100svh;
      }
      .aqyl-poster-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }
      .aqyl-poster-circle {
        position: absolute;
        left: 50%;
        top: var(--poster-circle-top);
        width: var(--poster-diameter);
        height: var(--poster-diameter);
        border-radius: 50%;
        background: #123f33;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .aqyl-poster [data-poster-letters] {
        z-index: 2;
        overflow: hidden;
      }
      .aqyl-poster .aqyl-poster-content {
        position: absolute;
        inset: auto;
        top: var(--poster-content-top);
        left: 50%;
        transform: translateX(-50%);
        width: min(480px, calc(100% - 64px));
        z-index: 3;
        text-align: center;
        color: #fffdf5;
        font-family: "Aqyl Poster Manrope", Manrope, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .aqyl-poster-content h2 {
        font:
          700 clamp(26px, 3.2vw, 40px)/1.22 "Aqyl Poster Manrope",
          Manrope,
          sans-serif;
        margin: 0;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      .aqyl-poster-content p {
        margin: 0;
      }
      .aqyl-poster-intro {
        font-size: 13px;
        line-height: 1.55;
        max-width: 350px;
        color: #d2e2d8;
        font-weight: 500;
      }
      .aqyl-poster-note {
        font-size: 14px;
        line-height: 1.6;
        max-width: 345px;
        color: #d2e2d8;
        font-weight: 500;
      }
      .aqyl-poster-menu {
        border: 1px solid #8aa799;
        border-radius: 30px;
        padding: 9px 18px;
        min-height: 44px;
        color: #fffdf5;
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .aqyl-poster-actions {
        width: 100%;
        max-width: 430px;
        display: grid;
        gap: 12px;
        margin-top: 4px;
      }
      .aqyl-poster-action {
        min-height: 58px;
        border-radius: 40px;
        padding: 8px 9px 8px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 15px;
        font-weight: 700;
        text-align: left;
        border: 1px solid transparent;
        transition:
          background-color 180ms,
          transform 180ms;
      }
      .aqyl-poster-action.primary {
        background: #d4f36b;
        color: #123f33;
      }
      .aqyl-poster-action.secondary {
        background: transparent;
        color: #fffdf5;
        border-color: #d2e2d8;
      }
      .aqyl-poster-arrow {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: #123f33;
        color: #d4f36b;
      }
      .aqyl-poster-action.secondary .aqyl-poster-arrow {
        background: #fffdf5;
        color: #123f33;
      }
      .aqyl-poster-action:hover {
        transform: translateY(-2px);
      }
      .aqyl-poster-action:active {
        transform: translateY(1px);
      }
      .aqyl-poster button:focus-visible,
      .aqyl-poster-close:focus-visible {
        outline: 3px solid #d4f36b;
        outline-offset: 5px;
      }
      .aqyl-poster .primary:focus-visible {
        outline-color: #fffdf5;
      }
      .aqyl-poster-decor {
        mask-image: linear-gradient(
          to right,
          #000,
          transparent 22%,
          transparent 78%,
          #000
        );
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .aqyl-poster-wave {
        position: absolute;
        width: clamp(320px, 45vw, 690px);
        height: auto;
        opacity: 1;
      }
      .aqyl-poster-wave.wave-0 {
        top: -160px;
        left: -230px;
        transform: rotate(-20deg);
      }
      .aqyl-poster-wave.wave-1 {
        top: -180px;
        right: -220px;
        transform: scaleX(-1);
      }
      .aqyl-poster-wave.wave-2 {
        bottom: -150px;
        left: -220px;
        transform: scaleY(-1);
      }
      .aqyl-poster-wave.wave-3 {
        bottom: -180px;
        right: -190px;
        transform: scale(-1);
      }
      .aqyl-poster-close {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 10000;
        background: #123f33;
        color: #fffdf5;
        border: 1px solid #d2e2d8;
        border-radius: 28px;
        min-height: 44px;
        padding: 10px 20px;
        font-family: Manrope, sans-serif;
      }
      @media (max-width: 599px) {
        .aqyl-poster .aqyl-poster-content {
          width: calc(100% - 56px);
          gap: 16px;
        }
        .aqyl-poster-content h2 {
          font-size: 27px;
        }
        .aqyl-poster-action {
          font-size: 13px;
          padding-left: 18px;
          min-height: 56px;
        }
        .aqyl-poster-intro {
          font-size: 12px;
        }
        .aqyl-poster-note {
          font-size: 13px;
        }
        .aqyl-poster-wave {
          opacity: 1;
          width: 300px;
        }
        .aqyl-poster-wave.wave-0 {
          left: -210px;
          top: -130px;
        }
        .aqyl-poster-wave.wave-1 {
          right: -205px;
          top: -145px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .aqyl-poster [data-portal-pin] {
          position: relative !important;
          top: 0 !important;
        }
        .aqyl-poster [data-portal-content] {
          margin-top: 0 !important;
          opacity: 1 !important;
        }
        .aqyl-poster button {
          transition: none !important;
          transform: none !important;
        }
      }

      /* Interaction fixes; poster geometry and palette are unchanged. */
      .aqyl-poster-menu-layer .aqyl-fullmenu-overlay {
        transition: visibility 0s linear 240ms;
      }
      .aqyl-poster-menu-layer .aqyl-fullmenu-overlay[data-state="open"] {
        transition-delay: 0s;
      }
      .aqyl-poster-menu-layer .aqyl-fullmenu-panel {
        transition-duration: 240ms;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scroll-padding-top: 80px;
      }
      .aqyl-poster-menu-layer .aqyl-fullmenu-backdrop {
        transition-duration: 240ms;
      }
      .aqyl-poster-menu-layer
        .aqyl-fullmenu-overlay[data-state="closed"]
        .aqyl-menu-item-inner,
      .aqyl-poster-menu-layer
        .aqyl-fullmenu-overlay[data-state="closed"]
        .aqyl-menu-fade {
        transition-duration: 200ms;
        transition-delay: 0ms;
      }
      .aqyl-poster-menu-layer .aqyl-fullmenu-panel > div.relative {
        flex-shrink: 0;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .aqyl-poster-menu-layer a:focus-visible,
      .aqyl-poster-menu-layer button:focus-visible {
        outline: 3px solid #185743;
        outline-offset: 4px;
      }
      .aqyl-poster-action {
        touch-action: manipulation;
        transition:
          transform 220ms ease,
          background-color 220ms ease;
      }
      .aqyl-poster-arrow {
        transition: transform 220ms ease;
      }
      .aqyl-poster-arrow svg {
        transition: transform 220ms ease;
      }
      .aqyl-poster-action:hover {
        transform: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .aqyl-poster-action:hover {
          transform: translateY(-2px);
        }
        .aqyl-poster-action:hover .aqyl-poster-arrow {
          transform: scale(1.06);
        }
        .aqyl-poster-action:hover .aqyl-poster-arrow svg {
          transform: translate(2px, -2px);
        }
      }
      .aqyl-poster-action:active {
        transform: translateY(2px);
      }
      .aqyl-poster-action:active .aqyl-poster-arrow {
        transform: scale(0.95);
      }
      .aqyl-poster-action:active .aqyl-poster-arrow svg {
        transform: translate(1px, -1px);
      }
      @media (prefers-reduced-motion: reduce) {
        .aqyl-poster-menu-layer .aqyl-fullmenu-overlay,
        .aqyl-poster-menu-layer .aqyl-fullmenu-panel,
        .aqyl-poster-menu-layer .aqyl-fullmenu-backdrop {
          transition: none !important;
        }
        .aqyl-poster-action,
        .aqyl-poster-arrow,
        .aqyl-poster-arrow svg {
          transition: none !important;
          transform: none !important;
        }
      }

      /* The menu's type and spacing respond to both viewport dimensions. */
      .aqyl-poster-menu-layer .aqyl-fullmenu-overlay {
        position: fixed;
        inset: 0;
        width: auto;
        height: 100vh;
        height: 100dvh;
      }
      .aqyl-poster-menu-layer .aqyl-fullmenu-panel {
        height: 100%;
        min-width: 0;
        overflow: auto;
        scroll-padding: 12px;
      }
      .aqyl-menu-decoration {
        position: absolute;
        inset: 0;
        overflow: clip;
        pointer-events: none;
      }
      .aqyl-menu-shell {
        box-sizing: border-box;
        min-height: 100%;
        width: 100%;
        max-width: 1200px;
        margin-inline: auto;
        padding: clamp(12px, 2dvh, 24px) clamp(18px, 4vw, 40px);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: clamp(8px, 1.5dvh, 18px);
      }
      .aqyl-menu-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        min-height: 48px;
        padding-right: 112px;
      }
      .aqyl-menu-top .brand-mark {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }
      .aqyl-menu-top .brand-word {
        font-size: 28px;
      }
      .aqyl-menu-top > div[aria-hidden] {
        display: none;
      }
      .aqyl-menu-nav {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .aqyl-menu-shell .aqyl-menu-list {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .aqyl-menu-shell .aqyl-menu-item-inner {
        display: block;
        width: 100%;
        min-width: 0;
      }
      .aqyl-menu-shell .aqyl-menu-link {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 0.5em minmax(0, 1fr) 0.4em;
        align-items: start;
        gap: 0.22em;
        width: calc(100% - 12px);
        min-height: 44px;
        padding: clamp(6px, 1.2dvh, 13px) 0;
        font-size: clamp(1.25rem, min(6.3vw, 8dvh), 5.75rem);
        line-height: 1.04;
        text-align: left;
        background: transparent;
        border: 0;
        white-space: normal;
      }
      .aqyl-menu-title {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .aqyl-menu-shell .aqyl-menu-link > span:first-child {
        margin: 0;
        padding-top: 0.2em;
        font-size: 0.28em;
      }
      .aqyl-menu-shell .aqyl-menu-link-arrow {
        align-self: center;
        transform: translate(-6px, 0);
      }
      .aqyl-menu-shell
        .aqyl-menu-link[data-active="true"]
        .aqyl-menu-link-arrow {
        transform: translate(0, 0);
      }
      .aqyl-menu-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px 24px;
        border-top: 1px solid var(--line);
        padding-top: clamp(8px, 1.5dvh, 16px);
        font-size: clamp(0.7rem, 1.1vw, 0.875rem);
        line-height: 1.45;
        color: var(--muted);
        font-weight: 600;
      }
      .aqyl-menu-footer > span:first-child {
        flex-shrink: 0;
      }
      .aqyl-menu-footer > span:last-child {
        text-align: right;
        max-width: 38em;
      }
      .aqyl-poster-menu-layer .aqyl-poster-close {
        top: max(12px, env(safe-area-inset-top));
        right: max(18px, env(safe-area-inset-right));
        min-height: 44px;
      }
      @media (max-width: 600px) {
        .aqyl-menu-shell .aqyl-menu-link {
          font-size: clamp(1.2rem, min(9vw, 7dvh), 2.4rem);
        }

      function addTaskTopic(grade, key, title, easy, medium, hard) {
        if (!TASK_BANK[grade]) TASK_BANK[grade] = {};
        const make = (level, arr, difficulty) =>
          arr.map((item, index) => ({
            id: `${grade}-${key}-${level}${index + 1}`,
            q: item[0],
            a: String(item[1]),
            difficulty,
          }));
        TASK_BANK[grade][key] = {
          title,
          easy: make("e", easy, 1),
          medium: make("m", medium, 2),
          hard: make("h", hard, 3),
        };
      }

                steps,
                answer,

            : null,

      const escapeHtml = (str) =>
        String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")

      const normalizeText = (value) =>
        String(value || "")
          .toLowerCase()
          .replace(/[ё]/g, "е")
          .replace(/[\s\_\-–—()²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉]/g, "")
          .replace(/[і]/g, "i")
          .replace(/[қ]/g, "к")
          .replace(/[ғ]/g, "г")
          .replace(/[ү]/g, "у")
          .replace(/[ұ]/g, "у")
          .replace(/[ө]/g, "о")
          .replace(/[ә]/g, "а")
          .replace(/[ң]/g, "н")
          .replace(/[һ]/g, "х");

      function renderLatexOrText(value, displayMode = false) {
        const text = String(value ?? "").trim();
        if (!text) return "";
        const pureFormula =
          /\|\^|_|\{|\}|\frac|\sqrt|\log|\int|\sin|\cos|\tan/.test(text) ||
          /^[0-9xya-zA-Z+\-*/=().,^\s]+$/.test(text);
        if (window.katex && pureFormula) {
          try {
            return katex.renderToString(text, {
              throwOnError: false,
              displayMode,
            });
          } catch (e) {}
        }
        return escapeHtml(text);
      }

      function renderMixedMath(value) {
        const text = String(value ?? "");
        const parts = text.split(/(\$[^$]+\$)/g).filter(Boolean);
        if (parts.length > 1) {
          return parts
            .map((part) => {
              if (part.startsWith("$") && part.endsWith("$"))
                return renderLatexOrText(part.slice(1, -1), false);
              return escapeHtml(part);
            })
            .join("");
        }
        return renderLatexOrText(text, false);
      }

          const topics = getGradeTopics(grade);
          const chunks = [];
          for (let i = 0; i < topics.length; i += 3)
            chunks.push(topics.slice(i, i + 3));
          result[grade] = chunks.map((chunk, unitIndex) => ({
            unit: `${grade}-сынып · Бөлім ${unitIndex + 1}`,
            about: chunk.map((topic) => topic.title).join(" · "),
            skills: chunk.map((topic, topicIndex) => ({
              id: `${grade}-${topic.key}`,
              grade,
              topicKey: topic.key,
              type:
                topicIndex === 0 && unitIndex === 0
                  ? "practice"
                  : topicIndex % 3 === 0
                    ? "video"
                    : topicIndex % 3 === 1
                      ? "practice"
                      : "test",
              title: topic.title,
              status: unitIndex === 0 && topicIndex === 0 ? "active" : "not",
              taskCount: [
                ...(topic.easy || []),
                ...(topic.medium || []),
                ...(topic.hard || []),
              ].length,
            })),
          }));
        });
        return result;
      }

      function aqylInterior(context, char, font) {
        const canvas = context.canvas;
        context.font = font;
        const m = context.measureText(char);
        const pad = 8;
        const left = Math.ceil(m.actualBoundingBoxLeft);
        const ascent = Math.ceil(m.actualBoundingBoxAscent);
        canvas.width = Math.max(
          1,
          Math.ceil(m.actualBoundingBoxLeft + m.actualBoundingBoxRight) +
            pad * 2,
        );
        canvas.height = Math.max(
          1,
          Math.ceil(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) +
            pad * 2,
        );
        context.font = font;
        context.fontKerning = "none";
        context.fillText(char, pad + left, pad + ascent);
        const { width, height } = canvas;
        const pixels = context.getImageData(0, 0, width, height).data;
        const rows = new Uint16Array(width + 1);
        let size = 0,
          bx = 0,
          by = 0;
        for (let y = 0; y < height; y++) {
          let diagonal = 0;
          for (let x = 0; x < width; x++) {
            const above = rows[x + 1];
            rows[x + 1] =
              pixels[(y * width + x) * 4 + 3] > 245
                ? Math.min(above, rows[x], diagonal) + 1
                : 0;
            diagonal = above;
            if (rows[x + 1] > size) {
              size = rows[x + 1];
              bx = x;
              by = y;
            }
          }
        }
        if (size < 3) return null;
        // Scan at 3× SVG size. Inscribe a disk in the square, with room for raster disagreement.
        return {
          x: (bx + 1 - size / 2 - pad - left) / 3,
          y: (by + 1 - size / 2 - pad - ascent) / 3,
          radius: (size / 2 - 1) / 3,
        };
      }

            body.style.paddingRight = previous.padding;

            decor = root.querySelector(".aqyl-poster-decor"),
            circle = root.querySelector(".aqyl-poster-circle"),
            content = root.querySelector("[data-portal-content]");
          const media = matchMedia("(prefers-reduced-motion: reduce)");
          let frame = 0,
            resizeFrame = 0,
            dead = false,
            geometry = null;
          const clamp = (x) => Math.max(0, Math.min(1, x));
          const smooth = (a, b, x) => {
            const t = clamp((x - a) / (b - a));
            return t * t * (3 - 2 * t);
          };
          function paint() {
            frame = 0;
            if (
              !geometry ||
              dead ||
              root.closest('[data-registration-paused="true"]')

            const { W, H, vh, overflow, travel, target, end } = geometry;
            const p = media.matches

            const t = smooth(0, 0.8, p),
              scale = Math.exp(Math.log(end) * t);
            const tx = (W / 2 - target.x) * t - target.x * (scale - 1);
            const ty = (H - vh / 2 - target.y) * t - target.y * (scale - 1);
            camera.setAttribute(
              "transform",

            const blend = smooth(0.72, 0.83, p),
              from = [22, 79, 61],

            const ink = `rgb(${from.map((v, i) => Math.round(v + (to[i] - v) * blend)).join(",")})`;

            }
          });

            dead = true;
            cancelAnimationFrame(frame);
            cancelAnimationFrame(resizeFrame);
            observer.disconnect();

          let st = null;

          const build = () => {
            if (st) st.kill();

            st = ScrollTriggerLib.create({
              trigger: pin,
              start: "top top",

      function AqylAiFinalCta({ onStart }) {
        const wrapRef = useRef(null);

          const gsapLib = window.gsap;
          const ScrollTriggerLib = window.ScrollTrigger;
          const wrap = wrapRef.current;

          if (!gsapLib || !ScrollTriggerLib || !wrap || !panel) return;
          gsapLib.registerPlugin(ScrollTriggerLib);

          let st = null;
          let revealed = false;

          const build = () => {
            if (st) st.kill();
            st = ScrollTriggerLib.create({
              trigger: wrap,
              start: "top bottom",
              end: "bottom bottom",
              scrub: 1,
              onUpdate: (self) => {
                const vh = window.innerHeight || 1;
                const wrapH = wrap.offsetHeight || 1;
                const riseThreshold = Math.min(
                  0.85,
                  Math.max(0.15, vh / wrapH),
                );
                const p = self.progress;
                const riseP = Math.min(1, Math.max(0, p / riseThreshold));

                const y = (1 - riseP) * 100;
                const scale = 0.94 + 0.06 * riseP;
                const radius = (1 - riseP) * 48;

                gsapLib.set(panel, {
                  y: y + "%",
                  scale,
                  borderTopLeftRadius: radius,
                  borderTopRightRadius: radius,
                });

                const shouldReveal = p > riseThreshold + 0.04;
                if (shouldReveal !== revealed) {
                  revealed = shouldReveal;
                  panel.classList.toggle("is-revealed", shouldReveal);
                }
              },
            });
          };

            clearTimeout(window._aqylctaResize);

      // AqylAI gradient footer — a normal footer whose content reads first,
      // with a soft blurred brand-color glow pinned to the bottom of the
      // viewport that rises up as the visitor scrolls through the last
      // stretch of the page, reaching full height exactly at the very end.
      const AQYLAI_FOOTER_STOPS = [
        { offset: 0, color: "#3767d6" }, // brand blue, floor
        { offset: 0.22, color: "#8fb3f2" }, // soft light blue
        { offset: 0.45, color: "#fbfaf6" }, // cream / almost white (--paper)
        { offset: 0.68, color: "#4fae86" }, // AqylAI green
        { offset: 0.87, color: "#9b83e0" }, // gentle violet
        { offset: 1, color: "#c8b6f000" }, // transparent violet, top
      ];

      function aqylFooterBellHeights(n, peak, valley, vbh) {
        const out = [];
        const mid = (n - 1) / 2;
        for (let i = 0; i < n; i++) {
          const t = mid === 0 ? 0 : Math.abs(i - mid) / mid;
          const eased = 1 - Math.pow(t, 1.28);
          out.push(peak * vbh * (valley + (1 - valley) * eased));
        }
        return out;
      }

      function AqylAiGradientFooter({ onStart, onLogin }) {
        const bandRef = useRef(null);
        const minReveal = 0.05;
        const [progress, setProgress] = useState(minReveal);
        const [isNarrow, setIsNarrow] = useState(
          typeof window !== "undefined" ? window.innerWidth < 768 : false,
        );

        useEffect(() => {
          const mq = window.matchMedia("(max-width: 767px)");
          const onChange = () => setIsNarrow(mq.matches);
          onChange();
          if (mq.addEventListener) mq.addEventListener("change", onChange);
          else mq.addListener(onChange);
          return () => {
            if (mq.removeEventListener)
              mq.removeEventListener("change", onChange);
            else mq.removeListener(onChange);
          };
        }, []);

        useEffect(() => {
          const el = bandRef.current;
          if (!el) return;
          let ticking = false;

          const measure = () => {
            ticking = false;
            const h = el.offsetHeight || 1;
            const left =
              document.documentElement.scrollHeight -
              window.innerHeight -
              window.scrollY;
            const t = Math.max(0, Math.min(1, (h - left) / h));
            setProgress(minReveal + (1 - minReveal) * t);
          };

          const onScroll = () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(measure);
          };

          measure();
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll, { passive: true });
          return () => {
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("resize", onScroll);
          };
        }, []);

        const scrollToTop = () =>
          window.scrollTo({ top: 0, behavior: "smooth" });
        const scrollToId = (id) => {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        };

        const vbw = 1271;
        const vbh = 599;
        const bars = isNarrow ? 6 : 9;

      function LandingPage({ onStart, onLogin }) {
        const categoriesTrackRef = useRef(null);
        const categoriesTweenRef = useRef(null);

        useEffect(() => {
          const track = categoriesTrackRef.current;
          if (!track || typeof gsap === "undefined") return;

          const reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;
          if (reduceMotion) return;

          let tween;

          const build = () => {
            if (tween) tween.kill();
            const firstGroup = track.children[0];
            if (!firstGroup) return;
            const distance = firstGroup.getBoundingClientRect().width;
            const pxPerSecond = 26; // slow, premium pace
            const duration = Math.max(distance / pxPerSecond, 18);
            gsap.set(track, { xPercent: 0 });
            tween = gsap.to(track, {
              xPercent: -50,
              duration,
              ease: "none",
              repeat: -1,
            });
            categoriesTweenRef.current = tween;
          };

          build();

          let resizeTimer;
          const onResize = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(build, 200);
          };
          window.addEventListener("resize", onResize);

          return () => {
            window.removeEventListener("resize", onResize);
            clearTimeout(resizeTimer);
            if (tween) tween.kill();
          };
        }, []);

        const handleCategoriesEnter = () => {
          if (categoriesTweenRef.current) {
            gsap.to(categoriesTweenRef.current, {
              timeScale: 0.25,
              duration: 0.6,
              ease: "power2.out",
            });
          }
        };
        const handleCategoriesLeave = () => {
          if (categoriesTweenRef.current) {
            gsap.to(categoriesTweenRef.current, {

      function OnboardingModal({ open, onClose, onComplete }) {
        const [form, setForm] = useState({
          name: "",
          email: "",
          password: "",
          grade: 8,
        });
        const [focusField, setFocusField] = useState(null);
        const [showPassword, setShowPassword] = useState(false);
        const [touched, setTouched] = useState({});
        const [submitted, setSubmitted] = useState(false);
        const [success, setSuccess] = useState(false);
        const [gradeTick, setGradeTick] = useState(0);
        const [reaction, setReaction] = useState(null);
        const [emptyAttempt, setEmptyAttempt] = useState(false);
        const reactionTimer = useRef(0);
        const reactBriefly = (next, duration) => {
          clearTimeout(reactionTimer.current);
          setReaction(next);
          reactionTimer.current = setTimeout(() => setReaction(null), duration);
        };
        const changeField = (field, event) => {
          const next = event.target.value;
          if (next === form[field]) return;
          const kind = event.nativeEvent?.inputType || "";
          const deleted =
            kind.startsWith("delete") ||
            (!kind.startsWith("insert") && next.length < form[field].length);
          setForm((previous) => ({ ...previous, [field]: next }));
          setEmptyAttempt(false);
          setFocusField(field);
          if (deleted) reactBriefly("delete", 550);
          else {
            clearTimeout(reactionTimer.current);
            setReaction(null);
          }
        };
        const lastFieldRef = useRef(null);
        const cursorFrame = useRef(0);
        const cursorPoint = useRef({ x: 0, y: 0 });
        const cursorAllowed = useRef(false);
        const dialogRef = useRef(null);
        const closeRef = useRef(onClose);
        closeRef.current = onClose;
        useEffect(() => {
          if (!open) return;
          clearTimeout(reactionTimer.current);
          setReaction(null);
          setEmptyAttempt(false);
          setFocusField(null);
          setShowPassword(false);
          setTouched({});
          setSubmitted(false);
          setSuccess(false);
          setGradeTick(0);
          lastFieldRef.current = null;
          const dialog = dialogRef.current;
          dialog.style.setProperty("--look-x", "0px");
          dialog.style.setProperty("--look-y", "0px");
          const motionQuery = matchMedia("(prefers-reduced-motion: reduce)"),
            pointerQuery = matchMedia("(hover: hover) and (pointer: fine)");
          const updateCursor = () => {
            cursorAllowed.current =
              pointerQuery.matches && !motionQuery.matches;
          };
          updateCursor();
          motionQuery.addEventListener("change", updateCursor);
          pointerQuery.addEventListener("change", updateCursor);
          const landing = document.querySelector(".aqyl-landing");
          const oldPaused = landing?.getAttribute("data-registration-paused");
          if (landing) landing.setAttribute("data-registration-paused", "true");
          const backgroundAnimations =
            landing
              ?.getAnimations?.({ subtree: true })
              .filter((a) => a.playState === "running") || [];
          backgroundAnimations.forEach((a) => a.pause());
          const backgroundTweens = window.gsap
            ? gsap.globalTimeline
                .getChildren(true, true, false)
                .filter(
                  (t) =>
                    !t.paused() &&
                    t
                      .targets()
                      .some(
                        (el) => el?.nodeType === 1 && landing?.contains(el),
                      ),
                )
            : [];
          backgroundTweens.forEach((t) => t.pause());
          const previouslyFocused = document.activeElement;
          const previousOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          const backdrop = dialog.parentElement;
          const siblings = Array.from(backdrop.parentElement.children).filter(
            (el) => el !== backdrop,
          );
          const previousInert = siblings.map((el) => el.inert);
          siblings.forEach((el) => {
            el.inert = true;
          });
          dialog.querySelector(".onboard-close").focus({ preventScroll: true });
          const handleKey = (event) => {
            if (event.key === "Escape") {
              event.preventDefault();
              closeRef.current();
              return;
            }
            if (event.key !== "Tab") return;
            const items = Array.from(
              dialog.querySelectorAll(
                'button:not(:disabled),input:not(:disabled),[tabindex="0"]',
              ),
            ).filter((el) => el.tabIndex >= 0 && el.getClientRects().length);
            const first = items[0],
              last = items[items.length - 1];
            if (!items.length) {
              event.preventDefault();
              dialog.focus();
              return;
            }
            if (
              event.shiftKey &&
              (document.activeElement === first ||
                !dialog.contains(document.activeElement))
            ) {
              event.preventDefault();
              last.focus();
            } else if (
              !event.shiftKey &&
              (document.activeElement === last ||
                !dialog.contains(document.activeElement))
            ) {
              event.preventDefault();
              first.focus();
            }
          };
          document.addEventListener("keydown", handleKey);
          return () => {
            motionQuery.removeEventListener("change", updateCursor);
            pointerQuery.removeEventListener("change", updateCursor);
            cursorAllowed.current = false;
            backgroundAnimations.forEach((a) => {
              if (a.playState === "paused") a.play();
            });
            backgroundTweens.forEach((t) => {
              if (t.parent) t.resume();
            });
            if (landing) {
              if (oldPaused === null)
                landing.removeAttribute("data-registration-paused");
              else landing.setAttribute("data-registration-paused", oldPaused);
            }
            clearTimeout(reactionTimer.current);
            cancelAnimationFrame(cursorFrame.current);
            cursorFrame.current = 0;
            document.removeEventListener("keydown", handleKey);
            document.body.style.overflow = previousOverflow;
            siblings.forEach((el, i) => {
              el.inert = previousInert[i];
            });
            if (previouslyFocused?.isConnected)
              previouslyFocused.focus({ preventScroll: true });
          };
        }, [open]);
        if (!open) return null;
        const errors = {
          name:
            form.name.trim().length > 1
              ? ""
              : "Атыңыз кемінде 2 таңбадан тұруы керек.",
          email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())
            ? ""
            : "Дұрыс email мекенжайын енгізіңіз.",
          password:
            form.password.length >= 4
              ? ""
              : "Пароль кемінде 4 таңбадан тұруы керек.",
        };
        const visibleErrors = Object.fromEntries(
          Object.entries(errors).filter(
            ([key, value]) => value && (submitted || touched[key]),
          ),
        );
        const canSubmit =
          !Object.values(errors).some(Boolean) && GRADES.includes(form.grade);
        const beginFocus = (field) => {
          cancelAnimationFrame(cursorFrame.current);
          cursorFrame.current = 0;
          lastFieldRef.current = field;
          setFocusField(field);
        };
        const endFocus = (field) => {
          setFocusField(null);
          setTouched((previous) => ({ ...previous, [field]: true }));
        };
        const moveCursor = (event) => {
          if (
            event.pointerType !== "mouse" ||
            focusField ||
            showPassword ||
            !cursorAllowed.current
          )
            return;
          cursorPoint.current = { x: event.clientX, y: event.clientY };
          if (cursorFrame.current) return;
          const shell = event.currentTarget;
          cursorFrame.current = requestAnimationFrame(() => {
            cursorFrame.current = 0;
            const rect = shell.getBoundingClientRect(),
              point = cursorPoint.current;
            let x = ((point.x - rect.left) / rect.width - 0.5) * 3.6,
              y = ((point.y - rect.top) / rect.height - 0.5) * 3.6;
            const distance = Math.hypot(x, y);
            if (distance > 2) {
              x *= 2 / distance;
              y *= 2 / distance;
            }
            shell.style.setProperty("--look-x", x + "px");
            shell.style.setProperty("--look-y", y + "px");
          });
        };
        const leaveCursor = (event) => {
          cancelAnimationFrame(cursorFrame.current);
          cursorFrame.current = 0;
          event.currentTarget.style.setProperty("--look-x", "0px");
          event.currentTarget.style.setProperty("--look-y", "0px");
        };
        const togglePassword = () => {
          cancelAnimationFrame(cursorFrame.current);
          cursorFrame.current = 0;
          const active = document.activeElement;
          const field = active?.matches(".onboard-input")
            ? active.name
            : lastFieldRef.current;
          setShowPassword((value) => !value);
          if (field) {
            setFocusField(field);
            dialogRef.current
              .querySelector("#onboard-" + field)
              ?.focus({ preventScroll: true });
          }
        };
        const submitForm = (event) => {
          event.preventDefault();
          setSubmitted(true);
          if (!canSubmit) {
            const empty = ["name", "email", "password"].every(
              (key) => !form[key].trim(),
            );
            setEmptyAttempt(empty);
            reactBriefly(empty ? "empty" : "error", 800);
            dialogRef.current
              .querySelector(
                "#onboard-" + Object.keys(errors).find((key) => errors[key]),
              )
              ?.focus();
            return;
          }
          // Freeze only the decorative SVG for a short farewell while the cabinet opens immediately.
          if (ReactDOM.flushSync) ReactDOM.flushSync(() => setSuccess(true));
          else setSuccess(true);
          const art = dialogRef.current.querySelector(
            ".onboard-react-characters",
          );
          if (
            !showPassword &&
            art?.cloneNode &&
            !window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ) {
            const rect = art.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              const echo = document.createElement("div");
              echo.setAttribute("aria-hidden", "true");
              echo.inert = true;
              Object.assign(echo.style, {
                position: "fixed",
                left: rect.left + "px",
                top: rect.top + "px",
                width: rect.width + "px",
                height: rect.height + "px",
                pointerEvents: "none",
                zIndex: "81",
              });
              const copy = art.cloneNode(true);
              copy.setAttribute("data-mood", "success");
              Object.assign(copy.style, {
                width: "100%",
                height: "100%",
                display: "block",
              });
              echo.appendChild(copy);
              document.body.appendChild(echo);
              if (echo.animate) {
                const farewell = echo.animate(
                  [
                    { opacity: 1 },
                    { opacity: 1, offset: 0.45 },
                    { opacity: 0 },
                  ],
                  { duration: 380, fill: "forwards" },
                );
                farewell.onfinish = farewell.oncancel = () => {
                  echo.remove();
                  farewell.onfinish = farewell.oncancel = null;
                };
              } else echo.remove();
            }
          }
          complete();
        };
        const complete = () => {
          const user = {
            name: form.name.trim(),
            email: form.email.trim(),
            grade: form.grade,
            xp: 0,
            streak: 0,
            level: 1,

      function matchesSearch(skill, unit, query) {
        const q = (query || "").trim().toLowerCase();

          .toLowerCase()
          .includes(q);

      function CabinPopover({
        id,
        label,
        children,
        triggerClass = "",
        active = false,
      }) {
        const [open, setOpen] = useState(false);
        const root = useRef(null);
        const trigger = useRef(null);
        const close = (restore = false) => {
          setOpen(false);
          if (restore) trigger.current?.focus();
        };
        useEffect(() => {
          if (!open) return;
          root.current
            .querySelector('[aria-checked="true"],.cn-popover button')
            ?.focus();
          const outside = (e) => {
            if (!root.current.contains(e.target)) close();
          };
          const key = (e) => {
            if (e.key === "Escape") {
              e.preventDefault();
              close(true);
            }
            if (
              ["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key) &&
              root.current.contains(e.target)
            ) {
              const options = Array.from(
                root.current.querySelectorAll(".cn-popover button"),
              );
              if (!options.length) return;
              e.preventDefault();
              const i = options.indexOf(document.activeElement);
              const next =
                e.key === "Home"
                  ? 0
                  : e.key === "End"
                    ? options.length - 1
                    : (i + (e.key === "ArrowUp" ? -1 : 1) + options.length) %
                      options.length;
              options[next].focus();
            }
          };
          document.addEventListener("pointerdown", outside);
          document.addEventListener("keydown", key);
          return () => {
            document.removeEventListener("pointerdown", outside);
            document.removeEventListener("keydown", key);
          };
        }, [open]);
        return (
          <div
            className="cn-popover-root"
            ref={root}
            onBlur={(e) => {
              if (e.relatedTarget && !e.currentTarget.contains(e.relatedTarget))
                close();
            }}
          >
            <button
              ref={trigger}
              type="button"
              className={triggerClass + (active ? " active" : "")}
              aria-expanded={open}
              aria-controls={id}
              onClick={() => setOpen((v) => !v)}
            >
              {label}
            </button>
            {open && (
              <div className="cn-popover" id={id}>
                {children(() => close(true))}
              </div>
            )}
          </div>
        );
      }

      function LessonWorkspace({ skill, onComplete, completed }) {
        const allowedTabs = ["theory", "example", "practice", "summary"];
        const getInitialTab = () => {
          const saved =
            localStorage.getItem(
              `${progressKey()}_lesson_tab_${skill?.id || "default"}`,
            ) || "theory";
          return allowedTabs.includes(saved) ? saved : "theory";
        };

        const [tab, setTab] = useState(getInitialTab);
        const [difficulty, setDifficulty] = useState("easy");
        const [taskIndex, setTaskIndex] = useState(0);
        const [answer, setAnswer] = useState("");
        const [checked, setChecked] = useState(null);
        const [hintOpen, setHintOpen] = useState(false);
        const [showSolution, setShowSolution] = useState(false);
        const [solutionText, setSolutionText] = useState("");
        const [aiAnalysis, setAiAnalysis] = useState("");
        const [aiLoading, setAiLoading] = useState(false);
        const [aiError, setAiError] = useState("");
        const [bookmarked, setBookmarked] = useState(false);
        const [noteText, setNoteText] = useState("");
        const [historyVersion, setHistoryVersion] = useState(0);

        useEffect(() => {
          const saved =
            localStorage.getItem(
              `${progressKey()}_lesson_tab_${skill?.id || "default"}`,
            ) || "theory";
          setTab(allowedTabs.includes(saved) ? saved : "theory");
          setDifficulty("easy");
          setTaskIndex(0);
          setAnswer("");
          setChecked(null);
          setHintOpen(false);
          setShowSolution(false);
          setSolutionText("");
          setAiAnalysis("");
          setAiError("");
          setAiLoading(false);
        }, [skill?.id]);

        useEffect(() => {
          if (!skill?.id) return;
          setBookmarked(getBookmarks().some((b) => b.id === skill.id));
          setNoteText(getNote(skill.id));
        }, [skill?.id]);

        useEffect(() => {
          if (skill?.id)
            localStorage.setItem(
              `${progressKey()}_lesson_tab_${skill.id}`,
              tab,
            );
        }, [skill?.id, tab]);

        const content = getLessonContent(skill);
        const tasksByDifficulty = content.tasks;
        const activeTasks = tasksByDifficulty[difficulty] || [];
        const currentTask =
          activeTasks[taskIndex] || content.tasks.all[0] || null;
        const totalTasks = content.tasks.all.length;
        const history = getSkillAnswerHistory(skill?.id);
        const uniqueCorrect = new Set(
          history.filter((item) => item.correct).map((item) => item.id),
        );
        const wrongAttempts = getWrongAttempts(skill?.id);
        const topicStats = calculateProgress(skill.grade).topics.find(
          (t) => t.skill.id === skill.id,
        );
        const taskCompletionPercent = topicStats?.percent ?? null;
        const masteryTarget = Math.min(6, Math.max(3, totalTasks || 3));
        const masteryPercent = Math.min(
          100,
          Math.round((uniqueCorrect.size / masteryTarget) * 100),
        );
        const currentTaskHistory = history.filter(
          (item) => item.id === currentTask?.id,
        );
        const currentTaskSolved = currentTaskHistory.some(
          (item) => item.correct,
        );
        const currentTaskWrong = wrongAttempts.some(
          (item) => item.id === currentTask?.id,
        );
        const recommendedDifficulty =
          masteryPercent >= 70
            ? "hard"
            : masteryPercent >= 35
              ? "medium"
              : "easy";
        const difficultyLabel = {
          easy: "Бастапқы",
          medium: "Орта",
          hard: "Күрделі",
        };
        const tabs = [
          ["theory", "Теория"],
          ["example", "Мысал"],
          ["practice", "Жаттығу"],
          ["summary", "Қорытынды"],
        ];

        const formulaSections = (content.sections || []).filter(
          (section) => section.type === "interactive_formula",
        );
        const rememberSections = (content.sections || []).filter(
          (section) => section.type === "remember",
        );
        const compactTheorySections = (content.sections || []).filter(
          (section) => section.type !== "example_steps",
        );

        const toggleBookmark = () => {
          if (!skill?.id) return;
          const list = getBookmarks();
          const exists = list.some((b) => b.id === skill.id);
          const next = exists
            ? list.filter((b) => b.id !== skill.id)
            : [
                ...list,
                {
                  id: skill.id,
                  grade: skill.grade,
                  title: skill.title,
                  unit: skill.unit || "",
                  topicKey: skill.topicKey,
                  savedAt: new Date().toISOString(),
                },
              ];
          setBookmarks(next);
          setBookmarked(!exists);
        };

        const saveCurrentNote = () => {
          if (skill?.id) setNote(skill.id, noteText);
        };

        const recordAttempt = (ok) => {
          if (!currentTask) return;
          if (!recordAnswer(skill, currentTask, answer, ok, difficulty)) return;
          setHistoryVersion((v) => v + 1);
          const nextCorrect = new Set(
            getSkillAnswerHistory(skill.id)
              .filter((item) => item.correct)
              .map((item) => item.id),
          );
          if (
            ok &&
            (nextCorrect.size >= masteryTarget || difficulty === "hard")
          )
            onComplete(skill?.id);
        };

        const getAiApiUrl = () => {
          const local =
            location.hostname === "127.0.0.1" ||
            location.hostname === "localhost";
          return local
            ? "http://127.0.0.1:8000/api/ai"
            : "https://backend-umur.onrender.com/api/ai";
        };

        const localSolutionReview = (mode = "analyze") => {
          const steps = solutionText
            .split(/\n+/)
            .map((s) => s.trim())
            .filter(Boolean);
          const finalOk = currentTask
            ? normalizeAnswer(answer) === normalizeAnswer(currentTask.a)
            : false;
          if (!solutionText.trim()) {
            return "Шешу жолы бос. AI талдау үшін кемінде 2–3 қадам жазыңыз: қандай формула қолдандыңыз, қалай ықшамдадыңыз, соңында қандай жауап шықты.";
          }
          if (steps.length < 2 && solutionText.trim().length < 45) {
            return "Шешу жолы өте қысқа. Толық талдау үшін әр қадамды бөлек жазыңыз. Мысалы:\n1) Формуланы анықтадым...\n2) Орнына қойдым...\n3) Ықшамдадым...";
          }
          if (mode === "hint") {
            return `Қысқа hint: алдымен осы тақырыптағы негізгі формуланы тексеріңіз. Содан кейін соңғы түрлендіруде таңба, дәреже немесе бөлім өзгермегенін салыстырыңыз.`;
          }
          if (mode === "mistake") {
            return finalOk
              ? "Соңғы жауап дұрыс көрінеді. Енді шешу жолындағы әр қадамда қолданылған формула мен арифметикалық түрлендіруді тексеріңіз. Егер бәрі негізделсе, шешім қабылданады."
              : `Соңғы жауап күтілетін жауаппен сәйкес емес. Бірінші тексеретін жер: формуланы дұрыс таңдадыңыз ба және соңғы ықшамдау кезінде таңба/бөлім өзгерген жоқ па. Күтілетін жауап: ${currentTask?.a || "—"}.`;
          }
          return finalOk
            ? `Талдау:\n✓ Қорытынды жауап дұрыс көрінеді.\n✓ Шешу жолыңызда бірнеше қадам бар, бұл жақсы.\nКелесі жақсарту: әр қадамға қысқа негіздеме қосыңыз — қандай формула қолданылды және неге солай түрлендірілді.`
            : `Талдау:\n• Шешу жолыңыз қабылданды, бірақ соңғы жауап сәйкес емес.\n• Қайта қарау керек: формула таңдауы, таңба, дәреже немесе бөлшекті қысқарту.\nКелесі қадам: соңғы екі түрлендіруді қайта есептеп, жауабыңызды ${currentTask?.a || "күтілетін жауаппен"} салыстырыңыз.`;
        };

        const analyzeStudentSolution = async (mode = "analyze") => {
          if (!currentTask) return;
          if (!solutionText.trim() && !answer.trim()) {
            setAiError("Алдымен шешу жолыңызды немесе жауабыңызды жазыңыз.");
            return;
          }
          setAiLoading(true);
          setAiError("");
          setAiAnalysis("");

          const modeText =
            {
              analyze:
                "Оқушының толық шешу жолын талда. Дайын шешімді бірден берме. Алғашқы қате қадамды, дұрыс тұсын және келесі қысқа қадамды көрсет.",
              hint: "Оқушыға тек қысқа hint бер. Соңғы жауапты ашпа.",
              mistake:
                "Оқушының шешу жолындағы бірінші ықтимал қатені тап және қысқа түсіндір.",
              model: "Оқушы сұрағандықтан, қысқа үлгі шешімді қадамдап көрсет.",
            }[mode] || "Оқушының шешу жолын талда.";

          try {
            const resp = await fetch(getAiApiUrl(), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                taskText: currentTask.q,
                expectedAnswer: currentTask.a,
                userAnswer: answer,
                solutionText,
                userMessage: modeText,
                lang: "kk",
              }),
            });
            if (!resp.ok) throw new Error(`AI API ${resp.status}`);
            const data = await resp.json();
            const reply =
              data?.reply ||
              data?.text ||
              data?.analysis ||
              localSolutionReview(mode);
            setAiAnalysis(reply);
          } catch (e) {
            setAiAnalysis(localSolutionReview(mode));
            setAiError(
              "Backend AI уақытша қолжетімсіз. Төменде жергілікті қысқа талдау көрсетілді.",
            );
          } finally {
            setAiLoading(false);
          }
        };

        const handleCheck = () => {
          if (!currentTask) return;
          const ok = normalizeAnswer(answer) === normalizeAnswer(currentTask.a);
          setChecked(ok);
          setShowSolution(false);
          recordAttempt(ok);
        };

        const resetPracticeState = () => {
          setChecked(null);
          setAnswer("");
          setHintOpen(false);
          setShowSolution(false);
          setSolutionText("");
          setAiAnalysis("");
          setAiError("");
        };

        const nextTask = () => {
          resetPracticeState();
          if (taskIndex < activeTasks.length - 1) setTaskIndex(taskIndex + 1);
          else setTaskIndex(0);
        };

        const prevTask = () => {
          resetPracticeState();
          if (taskIndex > 0) setTaskIndex(taskIndex - 1);
          else setTaskIndex(Math.max(0, activeTasks.length - 1));
        };

        const chooseDifficulty = (key) => {
          setDifficulty(key);
          setTaskIndex(0);
          resetPracticeState();
        };

        const openPractice = () => {
          setDifficulty(recommendedDifficulty);
          setTab("practice");
        };

        const StatusBadge = ({ children, tone = "neutral" }) => {
          const styles = {
            neutral: "bg-white border-[var(--line)] text-[var(--muted)]",
            green: "bg-green-50 border-green-200 text-green-800",
            blue: "bg-[var(--blue-soft)] border-[#cbd9ff] text-[var(--blue)]",
            amber: "bg-[#fff5d8] border-[#f3dfaa] text-[#8a5b00]",
            red: "bg-red-50 border-red-200 text-red-800",
          };
          return (
            <span
              className={`rounded-full border px-3 py-1 text-xs font-black ${styles[tone] || styles.neutral}`}
            >
              {children}
            </span>
          );
        };

        return (
          <div className="lesson-v10 p-5 lg:p-8 max-w-[980px] mx-auto">
            <style>{`
            .lesson-v10 .academy-panel { background: white; border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 1px 0 #e9edf2, 0 14px 34px rgba(19,36,58,.045); }

        const lessons = THEORY_BANK[grade] || THEORY_BANK[String(grade)] || [];
        return (

            <h1 className="text-4xl font-black mb-3">Теория кітапханасы</h1>
