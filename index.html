              {grade}-сынып бойынша барлық негізгі анықтамалар, формулалар және
              қадамдық мысалдар.
            </p>
            <div className="space-y-6">
              {lessons.map((lesson) => (
                <div key={lesson.id} className="skill-card p-6">
                  <div className="flex items-start justify-between gap-4 mb-4">
                    <div>
                      <h2 className="text-2xl font-black mb-2">
                        {lesson.title}
                      </h2>
                      <p className="font-semibold text-[var(--muted)] leading-7">
                        {lesson.summary}
                      </p>
                    </div>
                    <span className="pill shrink-0">{grade}-сынып</span>
                  </div>
                  <div className="grid gap-4">
                    {(lesson.sections || []).slice(0, 3).map((section, idx) => (
                      <TheorySectionCard key={idx} section={section} />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function loadJSON(key, fallback) {
        try {
          return JSON.parse(
            localStorage.getItem(key) || JSON.stringify(fallback),
          );
        } catch {
          return fallback;
        }
      }
      function saveJSON(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }
      // Versioned, profile-owned evidence. Legacy unowned logs remain untouched.
      function progressOwner() {
        const user = loadJSON("aqylai_user", null);
        return user?.id
          ? `id:${user.id}`
          : user?.email
            ? `email:${user.email.trim().toLowerCase()}`
            : null;
      }
      function progressKey() {
        const owner = progressOwner();
        return owner ? `aqylai_progress_v2_${encodeURIComponent(owner)}` : null;
      }
      function readProgress() {
        const key = progressKey();
        const value = key ? loadJSON(key, null) : null;
        return value?.version === 2 && value.owner === progressOwner()
          ? value
          : { version: 2, owner: progressOwner(), tasks: {}, recent: [] };
      }
      function evidenceKey(grade, skillId, taskId) {
        return JSON.stringify([String(grade), String(skillId), String(taskId)]);
      }
      function recordAnswer(skill, task, answer, correct, difficulty) {
        const key = progressKey();
        if (!key || !skill || !task) return false;
        const data = readProgress();
        const id = evidenceKey(skill.grade, skill.id, task.id);
        const previous = data.tasks[id];
        // Only consecutive identical submissions are duplicates; A → B → A is real.
        if (previous?.latest.answer === answer) return false;
        const attempt = {
          id: task.id,
          skillId: skill.id,
          grade: skill.grade,
          topic: skill.topicKey,
          owner: data.owner,
          answer,
          correct: !!correct,
          difficulty,
          q: task.q,
          expected: task.a,
          at: new Date().toISOString(),
        };
        data.tasks[id] = {
          first: previous?.first || attempt,
          latest: attempt,
          correctAttempt:
            previous?.correctAttempt || (correct ? attempt : null),
          count: (previous?.count || 0) + 1,
        };
        data.recent = [...data.recent, attempt].slice(-60);
        // One atomic write keeps cumulative first/latest/correct evidence with the log.
        saveJSON(key, data);
        window.dispatchEvent(new Event("aqylai-progress"));
        return true;
      }
      function skillEvidence(skill, data = readProgress()) {
        return getTopicTasks(skill).all.flatMap((task) => {
          const value = data.tasks[evidenceKey(skill.grade, skill.id, task.id)];
          return value ? [value] : [];
        });
      }
      function calculateProgress(grade) {
        const data = readProgress();
        const topics = flattenSkills(grade).map((skill) => {
          const tasks = getTopicTasks(skill).all;
          const total = getTopicForSkill(skill)
            ? new Set(tasks.map((t) => String(t.id))).size
            : null;
          const evidence = [
            ...new Map(
              skillEvidence(skill, data).map((e) => [String(e.first.id), e]),
            ).values(),
          ];
          const solved = evidence.filter((e) => e.correctAttempt).length;
          const wrong = evidence.filter((e) => !e.latest.correct).length;
          return {
            skill,
            total,
            evidence,
            solved,
            wrong,
            attempted: evidence.length,
            firstCorrect: evidence.filter((e) => e.first.correct).length,
            percent: total > 0 ? Math.round((solved / total) * 100) : null,
          };
        });
        const attempted = topics.reduce((n, t) => n + t.attempted, 0);
        const firstCorrect = topics.reduce((n, t) => n + t.firstCorrect, 0);
        const solved = topics.reduce((n, t) => n + t.solved, 0);
        const total = topics.every((t) => t.total !== null)
          ? topics.reduce((n, t) => n + t.total, 0)
          : null;
        const legacy = flattenSkills(grade).some(
          (s) =>
            loadJSON(`aqylai_answer_history_${s.id}`, []).length > 0 ||
            loadJSON("aqylai_completed", {})?.[s.id],
        );
        return {
          topics,
          attempted,
          solved,
          total,
          accuracy: attempted
            ? Math.round((firstCorrect / attempted) * 100)
            : null,
          percent: total > 0 ? Math.round((solved / total) * 100) : null,
          review: topics.filter((t) => t.wrong > 0).length,
          legacy,
        };
      }
      function getSkillAnswerHistory(skillId) {
        const skill = Object.values(COURSE_DATA)
          .flatMap((units) => units.flatMap((u) => u.skills))
          .find((s) => s.id === skillId);
        if (!skill) return [];
        // Actual retained records only, never reconstructed attempts.
        return skillEvidence(skill).flatMap((e) => [
          ...new Set([e.first, e.correctAttempt, e.latest].filter(Boolean)),
        ]);
      }
      function getWrongAttempts(skillId) {
        const skill = Object.values(COURSE_DATA)
          .flatMap((units) => units.flatMap((u) => u.skills))
          .find((s) => s.id === skillId);
        return skill
          ? skillEvidence(skill)
              .filter((e) => !e.latest.correct)
              .map((e) => e.latest)
          : [];
      }
      function getWeakSkills(grade) {
        return calculateProgress(grade)
          .topics.filter((t) => t.wrong > 0)
          .sort((a, b) => b.wrong - a.wrong);
      }
      function ProgressEvidenceNote({ stats }) {
        return (
          <p className="text-sm text-[var(--muted)] mt-3">
            {stats.legacy
              ? "Нәтиже осы профильдің сақталған жауаптары бойынша есептелді. Бұрынғы ортақ тарихтың иесі белгісіз: ол сақталды, бірақ есепке қосылмады."
              : "Нәтиже осы профильдің сақталған жауаптары бойынша есептелді."}
          </p>
        );
      }
      function getBookmarks() {
        return loadJSON("aqylai_bookmarks", []);
      }
      function setBookmarks(list) {
        saveJSON("aqylai_bookmarks", list);
      }
      function getNote(skillId) {
        return localStorage.getItem(`aqylai_note_${skillId}`) || "";
      }
      function setNote(skillId, value) {
        localStorage.setItem(`aqylai_note_${skillId}`, value);
      }

      function ProgressPage({ grade, completed }) {
        const stats = calculateProgress(grade);
        const weak = getWeakSkills(grade);
        return (
          <div className="p-8 lg:p-10 max-w-[1040px] mx-auto">
            <h1 className="text-4xl font-black mb-3">Прогресс</h1>
            <p className="font-semibold text-[var(--muted)] mb-7">
              Нәтиже ойын ұпайы емес, нақты математикалық дағдылар бойынша
              көрсетіледі.
            </p>
            <div className="grid md:grid-cols-4 gap-5 mb-7">
              {[
                [
                  stats.percent === null ? "—" : stats.percent + "%",
                  "Орындалған тапсырмалар",
                  "Дұрыс шешілген бірегей есептер / қолжетімді барлық есептер. Бұл меңгеру бағасы емес.",
                ],
                [
                  stats.solved + " есеп",
                  "Шешілген есептер",
                  "Кемінде бір рет дұрыс шешілген бірегей есептер саны.",
                ],
                [
                  stats.review,
                  "Қайталау керек",
                  "Соңғы жауабы қате есептері бар тақырыптар саны.",
                ],
                [
                  stats.accuracy === null
                    ? "Әзірге дерек жеткіліксіз"
                    : stats.accuracy + "%",
                  "Жауап дәлдігі",
                  "Дұрыс алғашқы жауаптар / жауап берілген бірегей есептер. Қайта жауап беру дәлдікті өсірмейді.",
                ],
              ].map((x) => (
                <div key={x[1]} className="skill-card p-6">
                  <div className="text-sm font-black text-[var(--muted)] mb-2">
                    {x[1]}
                  </div>
                  <div className="text-2xl font-bold text-[var(--sage)]">
                    {x[0]}
                  </div>
                  <p className="text-sm text-[var(--muted)] mt-2">{x[2]}</p>
                </div>
              ))}
            </div>
            <div className="grid lg:grid-cols-[1fr_.8fr] gap-6">
              <div className="skill-card p-6">
                <h2 className="text-2xl font-black mb-5">
                  Орындалған тапсырмалар
                </h2>
                <p className="text-sm mb-4">
                  Тақырыптағы дұрыс шешілген бірегей есептер үлесі. Бұл меңгеру
                  бағасы емес.
                </p>
                <ProgressEvidenceNote stats={stats} />
                {stats.topics.map(
                  ({ skill: s, percent: val, solved, total }) => {
                    return (
                      <div key={s.id} className="mb-5">
                        <div className="flex justify-between font-bold mb-2">
                          <span>{s.title}</span>
                          <span>
                            {val === null ? "—" : `${val}%`} · {solved}/
                            {total ?? "?"}
                          </span>
                        </div>
                        <div className="progress-track">
                          <div style={{ width: `${val || 0}%` }} />
                        </div>
                      </div>
                    );
                  },
                )}
              </div>
              <div className="skill-card p-6">
                <h2 className="text-2xl font-black mb-5">
                  Қайталауға ұсынылады
                </h2>
                <div className="space-y-3">
                  {!weak.length && (
                    <p>Қазір қайталауды қажет ететін сақталған қате жоқ.</p>
                  )}
                  {weak.map(({ skill, wrong }) => (
                    <div
                      key={skill.id}
                      className="rounded-2xl border border-[var(--line)] p-4"
                    >
                      <div className="font-black">{skill.title}</div>
                      <div className="text-sm font-semibold text-[var(--muted)] mt-1">
                        {wrong
                          ? `${wrong} есептің соңғы жауабы қате`
                          : "әлі толық аяқталмаған"}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      function ReviewPage({ grade, completed, setActiveSkill, setPage }) {
        const weak = getWeakSkills(grade, completed);
        const openSkill = (skill) => {
          const unit = COURSE_DATA[grade].find((u) =>
            u.skills.some((s) => s.id === skill.id),
          );
          setActiveSkill({
            ...skill,
            unit: unit?.unit || skill.unit,
            unitAbout: unit?.about || "",
          });
          setPage("lesson");
        };
        return (
          <div className="p-8 lg:p-10 max-w-[980px] mx-auto">
            <div className="mb-7">
              <div className="text-sm font-black uppercase tracking-wide text-[var(--sage)] mb-2">
                Personal review
              </div>
              <h1 className="text-4xl font-black tracking-[-.04em] mb-3">
                Қайталау жоспары
              </h1>
              <p className="font-semibold text-[var(--muted)] leading-7">
                Соңғы сақталған жауабы қате есептері бар тақырыптар көрсетіледі.
              </p>
            </div>
            <div className="space-y-4">
              {weak.map(({ skill, wrong }) => (
                <div
                  key={skill.id}
                  className="skill-card p-5 flex flex-col md:flex-row md:items-center gap-4"
                >
                  <div className="flex-1">
                    <div className="text-sm font-black text-[var(--sage)] mb-1">
                      {skill.unit}
                    </div>
                    <h2 className="text-2xl font-black">{skill.title}</h2>
                    <p className="font-semibold text-[var(--muted)] mt-1">
                      {wrong
                        ? `${wrong} есептің соңғы жауабы қате. Қысқа теорияны қарап, қайта шешіп көріңіз.`
                        : "Тақырып әлі аяқталмаған."}
                    </p>
                  </div>
                  <button
                    onClick={() => openSkill(skill)}
                    className="btn-rise btn-primary px-7 py-3"
                  >
                    Қайталау
                  </button>
                </div>
              ))}
              {!weak.length && (
                <div className="soft-callout p-7 font-black text-[var(--sage-dark)]">
                  Қазір қайталау тізімі бос. Барлық тақырып жақсы көрінеді.
                </div>
              )}
            </div>
          </div>
        );
      }

      function NotesPage({ grade, setActiveSkill, setPage }) {
        const bookmarks = getBookmarks().filter(
          (b) => Number(b.grade) === Number(grade),
        );
        const skills = flattenSkills(grade);
        const noted = skills
          .map((skill) => ({ skill, note: getNote(skill.id) }))
          .filter((x) => x.note.trim());
        const openSkill = (skill) => {
          const unit = COURSE_DATA[grade].find((u) =>
            u.skills.some((s) => s.id === skill.id),
          );
          setActiveSkill({
            ...skill,
            unit: unit?.unit || skill.unit,
            unitAbout: unit?.about || "",
          });
          setPage("lesson");
        };
        return (
          <div className="p-8 lg:p-10 max-w-[980px] mx-auto">
            <h1 className="text-4xl font-black mb-3">
              Блокнот және сақталған тақырыптар
            </h1>
            <p className="font-semibold text-[var(--muted)] mb-7">
              Маңызды тақырыптарды сақтап, жеке ескертпелер жазыңыз.
            </p>
            <div className="grid lg:grid-cols-2 gap-6">
              <div className="skill-card p-6">
                <h2 className="text-2xl font-black mb-4">Сақталғандар</h2>
                <div className="space-y-3">
                  {bookmarks.map((b) => {
                    const skill = skills.find((s) => s.id === b.id) || b;
                    return (
                      <button
                        key={b.id}
                        onClick={() => openSkill(skill)}
                        className="w-full text-left rounded-2xl border border-[var(--line)] p-4 hover:bg-[#f4f8f5]"
                      >
                        <div className="font-black">{b.title}</div>
                        <div className="text-sm font-semibold text-[var(--muted)]">
                          {b.unit || `${b.grade}-сынып`}
                        </div>
                      </button>
                    );
                  })}
                  {!bookmarks.length && (
                    <div className="font-semibold text-[var(--muted)]">
                      Әлі сақталған тақырып жоқ.
                    </div>
                  )}
                </div>
              </div>
              <div className="skill-card p-6">
                <h2 className="text-2xl font-black mb-4">Ескертпелер</h2>
                <div className="space-y-3">
                  {noted.map(({ skill, note }) => (
                    <button
                      key={skill.id}
                      onClick={() => openSkill(skill)}
                      className="w-full text-left rounded-2xl border border-[var(--line)] p-4 hover:bg-[#f4f8f5]"
                    >
                      <div className="font-black">{skill.title}</div>
                      <div className="text-sm font-semibold text-[var(--muted)] mt-1 line-clamp-2">
                        {note}
                      </div>
                    </button>
                  ))}
                  {!noted.length && (
                    <div className="font-semibold text-[var(--muted)]">
                      Ескертпе жазылмаған.
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      function ProfilePage({ user, onLogout, completed, grade }) {
        const skills = flattenSkills(grade);
        const done = skills.filter((s) => completed?.[s.id]).length;
        const percent = skills.length
          ? Math.round((done / skills.length) * 100)
          : 0;
        const bookmarks = getBookmarks().filter(
          (b) => Number(b.grade) === Number(grade),
        ).length;
        return (
          <div className="p-8 lg:p-10 max-w-[980px] mx-auto">
            <h1 className="text-4xl font-black mb-7">Жеке кабинет</h1>
            <div className="skill-card p-7 flex flex-col md:flex-row gap-6 mb-6">
              <div className="w-24 h-24 rounded-3xl bg-[var(--sage)] text-white grid place-items-center text-4xl font-black">
                {user.name.slice(0, 1).toUpperCase()}
              </div>
              <div className="flex-1">
                <h2 className="text-3xl font-black">{user.name}</h2>
                <p className="font-semibold text-[var(--muted)] mb-5">
                  {grade}-сынып · {user.email}
                </p>
                <div className="grid sm:grid-cols-4 gap-4">
                  {[
                    ["Аяқталған сабақ", done],
                    [
                      "Жауап дәлдігі",
                      calculateProgress(grade).accuracy === null
                        ? "Әзірге дерек жеткіліксіз"
                        : calculateProgress(grade).accuracy + "%",
                    ],
                    ["Сақталған", bookmarks],
                    ["Шешілген есептер", calculateProgress(grade).solved],
                  ].map((x) => (
                    <div
                      key={x[0]}
                      className="rounded-2xl border border-[var(--line)] p-4"
                    >
                      <div className="text-sm text-[var(--muted)] font-bold">
                        {x[0]}
                      </div>
                      <div className="text-2xl font-black">{x[1]}</div>
                    </div>
                  ))}
                </div>
                <button
                  onClick={onLogout}
                  className="btn-rise btn-secondary px-8 py-3 mt-6"
                >
                  Шығу
                </button>
              </div>
            </div>
            <div className="soft-callout p-6">
              <h2 className="text-2xl font-black mb-2">Сақталған нәтижелер</h2>
              <ProgressEvidenceNote stats={calculateProgress(grade)} />
            </div>
          </div>
        );
      }

      function AcademyApp({ user, onLogout }) {
        const [grade, setGrade] = useState(() =>
          loadJSON(`${progressKey()}_grade`, user.grade || 8),
        );
        const [, refreshProgress] = useState(0);
        useEffect(() => {
          const refresh = () => refreshProgress((v) => v + 1);
          window.addEventListener("aqylai-progress", refresh);
          window.addEventListener("storage", refresh);
          return () => {
            window.removeEventListener("aqylai-progress", refresh);
            window.removeEventListener("storage", refresh);
          };
        }, []);
        const [page, setPage] = useState("course");
        const [section, setSection] = useState("course");
        const navigate = (next) => {
          setSection(
            next === "lesson" ? (page === "lesson" ? section : page) : next,
          );
          setPage(next);
        };
        const activeSection = page === "lesson" ? section : page;
        const [search, setSearch] = useState("");
        const [completed, setCompleted] = useState(() => {
          try {
            return JSON.parse(
              localStorage.getItem(`${progressKey()}_completed`) || "{}",
            );
          } catch {
            return {};
          }
        });
        const [currentUser, setCurrentUser] = useState(user);
        const [activeSkill, setActiveSkill] = useState(
          () =>
            flattenSkills(grade).find((s) => s.status === "active") ||
            flattenSkills(grade)[0],
        );
        useEffect(() => {
          localStorage.setItem(
            `${progressKey()}_completed`,
            JSON.stringify(completed),
          );
        }, [completed]);
        useEffect(() => {
          localStorage.setItem("aqylai_user", JSON.stringify(currentUser));
        }, [currentUser]);
        const onGradeChange = (g) => {
          setGrade(g);
          saveJSON(`${progressKey()}_grade`, g);
          localStorage.setItem("aqylai_grade", String(g));
          const next =
            flattenSkills(g).find((s) => s.status === "active") ||
            flattenSkills(g)[0];
          setActiveSkill(next);
          setPage("course");
          setSearch("");
        };
        const onComplete = (skillId) => {
          if (!skillId || completed[skillId]) return;
          setCompleted((prev) => ({ ...prev, [skillId]: true }));
          setCurrentUser((prev) => ({ ...prev, xp: (prev.xp || 0) + 10 }));
        };
        return (
          <div className="min-h-screen bg-white app-has-mobile-nav cabin-nav-ui">
            <div className="app-shell">
              <CourseNavigator
                grade={grade}
                setGrade={setGrade}
                activeSkill={activeSkill}
                setActiveSkill={setActiveSkill}
                setPage={navigate}
                completed={completed}
                search={search}
                setSearch={setSearch}
                activeSection={activeSection}
                onLogout={onLogout}
                onGradeChange={onGradeChange}
              />
              <main className="main-workspace">
                <WorkspaceStrip
                  user={currentUser}
                  grade={grade}
                  completed={completed}
                />

                {page === "course" && (
                  <CourseHome
                    grade={grade}
                    setActiveSkill={setActiveSkill}
                    setPage={navigate}
                    completed={completed}
                    search={search}
                  />
                )}
                {page === "lesson" && (
                  <LessonWorkspace
                    skill={activeSkill}
                    onComplete={onComplete}
                    completed={completed}
                  />
                )}
                {page === "theory" && <TheoryPage grade={grade} />}
                {page === "progress" && (
                  <ProgressPage grade={grade} completed={completed} />
                )}
                {page === "review" && (
                  <ReviewPage
                    grade={grade}
                    completed={completed}
                    setActiveSkill={setActiveSkill}
                    setPage={navigate}
                  />
                )}
                {page === "notes" && (
                  <NotesPage
                    grade={grade}
                    setActiveSkill={setActiveSkill}
                    setPage={navigate}
                  />
                )}
                {page === "profile" && (
                  <ProfilePage
                    user={currentUser}
                    onLogout={onLogout}
                    completed={completed}
                    grade={grade}
                  />
                )}
              </main>
            </div>
            <MobileBottomNav
              setPage={navigate}
              activeSection={activeSection}
              onLogout={onLogout}
            />
          </div>
        );
      }

      function App() {
        const [modalOpen, setModalOpen] = useState(false);
        const [user, setUser] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem("aqylai_user") || "null");
          } catch {
            return null;
          }
        });
        const demoLogin = () => {
          const demo = {
            name: "Demo оқушы",
            email: "demo@aqyl.ai",
            grade: 8,
            goal: "school",
            xp: 0,
            streak: 0,
            level: 1,
          };
          localStorage.setItem("aqylai_user", JSON.stringify(demo));
          localStorage.setItem("aqylai_current_user", demo.name);
          localStorage.setItem("aqylai_grade", String(demo.grade));
          setUser(demo);
        };
        const logout = () => {
          localStorage.removeItem("aqylai_user");
          localStorage.removeItem("aqylai_current_user");
          setUser(null);
        };
        return (
          <>
            {user ? (
              <AcademyApp user={user} onLogout={logout} />
            ) : (
              <LandingPage
                onStart={() => setModalOpen(true)}
                onLogin={demoLogin}
              />
            )}
            <OnboardingModal
              open={modalOpen}
              onClose={() => setModalOpen(false)}
              onComplete={(u) => {
                setUser(u);
                setModalOpen(false);
              }}
            />
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
